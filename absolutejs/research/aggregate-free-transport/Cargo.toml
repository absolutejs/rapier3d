[workspace]
[package]
name = "absolutejs-aggregate-free-transport-research"
version = "0.0.0"
edition = "2021"
publish = false
[dependencies]
num-traits = { version = "=0.2.19", default-features = false, features = ["libm"] }
rapier3d = { path = "../../../crates/rapier3d", features = ["profiler"] }
bincode = "=1.3.3"
[features]
default = ["candidate"]
candidate = []
parallel = ["rapier3d/parallel"]
snapshot = ["rapier3d/serde-serialize"]

[[test]]
name = "upstream-coupling-topology"
path = "../../../crates/rapier3d/tests/multibody_coupling_topology.rs"
