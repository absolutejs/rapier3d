[package]
name = "hello-rapier-wasm-probe"
version = "0.21.0"
edition = "2018"
[features]
default = ["dim3"]
dim3 = []
[lib]
name = "rapier_wasm3d"
path = "../../src/lib.rs"
crate-type = ["cdylib", "rlib"]
[dependencies]
rapier3d = { version = "=0.36.0", features = ["serde-serialize", "debug-render", "profiler", "fem"] }
parry3d = { version = "=0.31.1", git = "https://github.com/absolutejs/parry", rev = "586b1838707fe733ae33fa9e25c32a0941628a06", default-features = false, features = ["required-features"] }
parry3d-f64 = { version = "=0.31.1", git = "https://github.com/absolutejs/parry", rev = "586b1838707fe733ae33fa9e25c32a0941628a06", default-features = false, features = ["required-features", "std", "alloc"] }
ref-cast = "1"
wasm-bindgen = "0.2.109"
js-sys = "0.3"
nalgebra = "0.35"
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
palette = "0.7"
